<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Clipper</title>
<style>
  :root {
    --bg: #101114; --panel: #191b20; --line: #2a2d35; --text: #eceef2; --dim: #9096a3;
    --accent: #ffe500; --accent-ink: #15130a; --live: #ff4d4d; --ok: #58d68d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 2px; letter-spacing: -0.3px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin: 0 0 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 320px; min-width: 0; background: #0c0d10; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
  input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { border: 0; border-radius: 8px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .go { background: var(--accent); color: var(--accent-ink); }
  .stop { background: var(--live); color: #fff; }
  .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  label { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  select { width: 100%; margin-top: 4px; background: #0c0d10; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); text-transform: none;
    font-size: 14px; letter-spacing: 0; margin-top: 22px; }
  .status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .recording .dot { background: var(--live); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .status b { font-weight: 600; }
  .pill { color: var(--dim); font-size: 13px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
  .err { color: #ff9c9c; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card video { width: 100%; display: block; background: #000; aspect-ratio: 9/16; object-fit: contain; }
  .card.wide video { aspect-ratio: 16/9; }
  .meta { padding: 10px 12px 12px; }
  .meta .t { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .meta .r { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .meta a { color: var(--accent); font-size: 13px; text-decoration: none; }
  .empty { color: var(--dim); padding: 30px 0; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
  h2 { font-size: 16px; margin: 26px 0 8px; display: flex; align-items: center; gap: 10px; }
  details { margin-top: 26px; }
  summary { cursor: pointer; color: var(--dim); }
  pre { background: #0c0d10; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 8px 0 0;
        max-height: 260px; overflow: auto; font: 12.5px/1.5 Consolas, monospace; color: #c5cad4; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Live <span>Clipper</span></h1>
  <p class="sub">Paste a YouTube live link. Funny moments are cut into captioned clips for as long as the stream runs.</p>

  <div class="panel">
    <div class="row">
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      <button id="go" class="go">Start clipping</button>
      <button id="stop" class="stop" hidden>Stop</button>
    </div>
    <div class="opts">
      <div><label>Clip shape<select id="layout">
        <option value="vertical">Vertical 9:16, blurred background</option>
        <option value="crop">Vertical 9:16, zoomed to fill</option>
        <option value="horizontal">Horizontal 16:9</option></select></label></div>
      <div><label>How picky<select id="sensitivity">
        <option value="low">Only the best (fewer clips)</option>
        <option value="medium" selected>Balanced</option>
        <option value="high">Generous (more clips)</option></select></label></div>
      <div><label>Spoken language<select id="language">
        <option value="auto">Detect automatically</option>
        <option value="en">English</option><option value="hi">Hindi</option>
        <option value="ta">Tamil</option><option value="te">Telugu</option>
        <option value="bn">Bengali</option><option value="mr">Marathi</option>
        <option value="ur">Urdu</option><option value="es">Spanish</option>
        <option value="pt">Portuguese</option><option value="id">Indonesian</option>
        <option value="ja">Japanese</option><option value="ko">Korean</option></select></label></div>
      <div><label>Caption accuracy<select id="model">
        <option value="base">Fast</option>
        <option value="small" selected>Good</option>
        <option value="medium">Better (slower)</option>
        <option value="large-v3-turbo">Best (needs a good GPU)</option></select></label></div>
      <div><label>If YouTube asks to sign in<select id="cookies">
        <option value="">Don't use my browser login</option>
        <option value="chrome">Use my Chrome login</option>
        <option value="edge">Use my Edge login</option>
        <option value="firefox">Use my Firefox login</option></select></label></div>
      <label class="check"><input id="translate" type="checkbox"> Captions in English (translate)</label>
    </div>
    <div id="err" class="err" hidden></div>
  </div>

  <div id="status" class="status" hidden>
    <span class="dot"></span><b id="stateText"></b>
    <span id="pills"></span>
  </div>

  <h2>Clips <span id="count" class="pill">0</span>
    <button id="folder" class="ghost" style="padding:6px 12px;margin-left:auto">Open clips folder</button></h2>
  <div id="empty" class="empty">Clips will appear here. The first one can only show up a couple of minutes after a funny moment happens.</div>
  <div id="grid" class="grid"></div>

  <details><summary>Activity log</summary><pre id="log"></pre></details>
</main>
<script>
const $ = id => document.getElementById(id);
let shown = new Set(), jobFolder = "";

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"},
                                      body: JSON.stringify(body)} : undefined);
  return [r.ok, await r.json()];
}
function showErr(t) { $("err").textContent = t || ""; $("err").hidden = !t; }
const mins = s => s >= 3600 ? (s / 3600).toFixed(1) + " h" : Math.round(s / 60) + " min";

$("go").onclick = async () => {
  showErr("");
  $("go").disabled = true;
  const [ok, d] = await api("/api/start", {
    url: $("url").value, layout: $("layout").value, sensitivity: $("sensitivity").value,
    language: $("language").value, model: $("model").value, cookies: $("cookies").value,
    translate: $("translate").checked });
  if (!ok) { showErr(d.error); $("go").disabled = false; return; }
  shown = new Set(); $("grid").innerHTML = "";
  poll();
};
$("stop").onclick = () => { $("stop").disabled = true; api("/api/stop", {}); };
$("folder").onclick = () => api("/api/open-folder", {});
$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

async function poll() {
  let d;
  try { d = (await api("/api/status"))[1]; } catch { return; }
  const busy = d.state === "starting" || d.state === "recording";
  $("go").hidden = busy; $("go").disabled = false;
  $("stop").hidden = !busy; if (!busy) $("stop").disabled = false;
  $("status").hidden = d.state === "idle";
  $("status").className = "status " + (d.state === "recording" ? "recording" : "");
  const names = {starting: "Starting up (first run downloads the speech model)...", recording: "Watching: ",
                 stopped: "Stopped: ", error: "Stopped with a problem"};
  $("stateText").textContent = (names[d.state] || "") + (d.state === "recording" || d.state === "stopped" ? (d.title || "") : "");
  if (d.stats) {
    const p = [`${mins(d.stats.analysed)} analysed`];
    if (d.device && d.device !== "?") p.push(d.device === "cuda" ? "GPU" : "CPU");
    p.push(d.judge ? "Claude judge on" : "built-in scoring");
    if (d.chat) p.push(`${d.chat} chat messages read`);
    $("pills").innerHTML = p.map(x => `<span class="pill">${x}</span>`).join(" ");
  }
  if (d.state === "error") showErr(d.error);
  if (d.folder !== jobFolder) { jobFolder = d.folder; shown = new Set(); $("grid").innerHTML = ""; }
  for (const c of [...(d.clips || [])].reverse()) {
    if (shown.has(c.file)) continue;
    shown.add(c.file);
    const el = document.createElement("div");
    el.className = "card" + ($("layout").value === "horizontal" ? " wide" : "");
    const src = "/clip/" + encodeURIComponent(c.file);
    el.innerHTML = `<video controls preload="metadata" src="${src}"></video><div class="meta">
      <div class="t"></div><div class="r"></div><a href="${src}" download>Download</a></div>`;
    el.querySelector(".t").textContent = c.title;
    el.querySelector(".r").textContent = `${c.seconds}s · ${c.made} · ${c.reason}`;
    $("grid").prepend(el);
  }
  $("count").textContent = shown.size;
  $("empty").hidden = shown.size > 0;
  const log = $("log"), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = (d.logs || []).join("\n");
  if (atEnd) log.scrollTop = log.scrollHeight;
}
setInterval(poll, 2500); poll();
</script>
</body>
</html>
